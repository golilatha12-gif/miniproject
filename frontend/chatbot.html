<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RiceGuard Chatbot (Ollama)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; }
    textarea { width: 100%; height: 120px; font-size: 14px; }
    button { padding: 8px 12px; font-size: 14px; }
    #reply { white-space: pre-wrap; margin-top: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; background:#fafafa }
    .error { color: #900 }
  </style>
</head>
<body>
  <h2>RiceGuard Chatbot (phi3)</h2>

  <label for="prompt">Enter your question:</label>
  <textarea id="prompt" placeholder="Describe your rice disease or ask a question..."></textarea>
  <div style="margin-top:8px">
    <button id="send">Send</button>
    <button id="clear">Clear</button>
  </div>

  <div id="status" style="margin-top:12px"></div>
  <div id="reply"></div>

  <script src="js/chatbot.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Farming Assistant – RiceGuard</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

<script>
  // Authentication guard - redirect if not logged in
  const riceguardUser = localStorage.getItem("riceguard_user");
  if (!riceguardUser) {
    window.location.href = "login.html";
  }
</script>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html">
      🌾 <strong>Rice<span style="color:var(--primary)">Guard</span></strong>
    </a>
    <div class="nav-links">
      <a href="index.html">Detect</a>
      <a href="history.html">History</a>
      <a href="chatbot.html" class="active">Chatbot</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="about.html">About</a>
    </div>

    <div class="profile-section">
      <button id="userBtn" class="btn btn-icon">👤</button>
    </div>
  </div>
</nav>

<!-- ================= MAIN ================= -->
<main class="container mt-6 animate-fade">

  <!-- HEADER -->
  <div class="text-center mb-6">
    <div class="chatbot-icon">🤖</div>
    <h1>Farming Assistant</h1>
    <p class="text-muted">
      Ask anything about rice diseases, farming & treatments
    </p>
  </div>

  <!-- CHAT CARD -->
  <div class="card chat-card">

    <!-- CHAT BODY -->
    <div id="chatBody" class="chat-body">
      <!-- Messages injected here -->
    </div>

    <!-- QUICK QUESTIONS -->
    <div class="quick-questions">
      <span class="text-muted">✨ Quick questions:</span>
      <button onclick="quickAsk('What is Bacterial Leaf Blight?')">What is BLB?</button>
      <button onclick="quickAsk('How to prevent rice diseases?')">Prevention</button>
      <button onclick="quickAsk('Best fertilizers for rice?')">Fertilizers</button>
      <button onclick="quickAsk('When to harvest rice?')">Harvest</button>
    </div>

    <!-- INPUT -->
    <div class="chat-input">
      <input
        type="text"
        id="chatInput"
        placeholder="Type your message..."
        onkeypress="if(event.key==='Enter') sendMessage()"
      />
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>

  </div>

</main>

<script src="js/chatbot.js"></script>
</body>
</html>
