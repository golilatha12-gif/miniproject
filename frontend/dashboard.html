<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – RiceGuard AI</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

<script>
  // Authentication guard - redirect if not logged in
  const riceguardUser = localStorage.getItem("riceguard_user");
  if (!riceguardUser) {
    window.location.href = "login.html";
  }
</script>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    🌾 <strong>RiceGuard</strong>
    <button id="closeSidebar">✖</button>
  </div>

  <nav class="sidebar-nav">
    <a href="dashboard.html" class="active">📊 Overview</a>
    <a href="index.html">📷 New Detection</a>
    <a href="history.html">📁 History</a>
    <a href="chatbot.html">💬 Chatbot</a>
    <a href="profile.html">👤 Profile</a>
  </nav>
</aside>

<!-- ================= MAIN ================= -->
<div class="dashboard-wrapper">

  <!-- HEADER -->
  <header class="dashboard-header">
    <button id="openSidebar" class="menu-btn">☰</button>
    <h1>Dashboard</h1>
    <button id="userBtn" class="user-btn">👤</button>
  </header>

  <!-- CONTENT -->
  <main class="dashboard-content animate-fade">

    <!-- ================= STATS ================= -->
    <div class="stats-grid">

      <div class="card stat-card">
        <h3>Total Detections</h3>
        <p class="stat-value" id="totalDetections">0</p>
      </div>

      <div class="card stat-card">
        <h3>Diseases Found</h3>
        <p class="stat-value" id="diseaseCount">0</p>
      </div>

      <div class="card stat-card">
        <h3>Avg Confidence</h3>
        <p class="stat-value" id="avgConfidence">0%</p>
      </div>

      <div class="card stat-card">
        <h3>Severe Cases</h3>
        <p class="stat-value" id="severeCount">0</p>
      </div>

    </div>

    <!-- ================= GRID ================= -->
    <div class="dashboard-grid">

      <!-- DISEASE DISTRIBUTION -->
      <div class="card">
        <h2>Disease Distribution</h2>
        <canvas id="distributionChart"></canvas>
      </div>

      <div class="card">
        <h2>Detections Over Time</h2>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
          <button id="trendDaily" class="btn btn-sm">Daily</button>
          <button id="trendWeekly" class="btn btn-sm">Weekly</button>
        </div>
        <canvas id="trendChart"></canvas>
      </div>

      <div class="card">
        <h2>Counts Per Disease</h2>
        <canvas id="barChart"></canvas>
      </div>

      <!-- RECENT -->
      <div class="card">
        <h2>Recent Detections</h2>
        <div id="filterInfo" style="margin-bottom:8px;display:none;"></div>
        <div id="recentList"></div>

        <a href="history.html" class="btn btn-outline full-width mt-4">
          View All History
        </a>
      </div>

    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/auth_util.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
